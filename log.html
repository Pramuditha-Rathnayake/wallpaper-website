<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up - Wallpaper Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            color: #fff;
        }

        .home-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            text-decoration: none;
            color: #f8fafc;
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        .login-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
            text-align: center;
        }

        .login-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .login-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #0284c7;
            color: #fff;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }

        .footer-text a {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn"><i class="fas fa-home"></i> Home</a>

    <div class="login-card">
        <h2 id="formTitle" class="login-title">Welcome Back</h2>
        <p id="formSubtitle" class="login-subtitle">Please login to your account</p>

        <form id="authForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" class="input-field" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" class="input-field" placeholder="Password" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Login</button>
        </form>

        <p class="footer-text">
            <span id="toggleText">Don't have an account?</span> 
            <a id="toggleBtn" onclick="toggleForm()">Sign Up</a>
        </p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // Your Exact Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD41TGeI4JyIOfvaCj55g1694ReGOS2QHw",
            authDomain: "wallpaper-website-d8b4d.firebaseapp.com",
            projectId: "wallpaper-website-d8b4d",
            storageBucket: "wallpaper-website-d8b4d.firebasestorage.app",
            messagingSenderId: "972279667738",
            appId: "1:972279667738:web:be47e15e41c32a0f7005a3",
            measurementId: "G-5NKB99MZYT"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isSignUp = false;

        function toggleForm() {
            isSignUp = !isSignUp;
            document.getElementById('formTitle').innerText = isSignUp ? "Create Account" : "Welcome Back";
            document.getElementById('formSubtitle').innerText = isSignUp ? "Sign up to start using the app" : "Please login to your account";
            document.getElementById('btnSubmit').innerText = isSignUp ? "Sign Up" : "Login";
            document.getElementById('toggleText').innerText = isSignUp ? "Already have an account?" : "Don't have an account?";
            document.getElementById('toggleBtn').innerText = isSignUp ? "Login" : "Sign Up";
        }

        // Send Email Notification to Admin
        function sendEmailNotification(userEmail, actionType) {
            const myEmail = "pramudithashmpr@gmail.com";
            const timeNow = new Date().toLocaleString();
            
            fetch("https://formsubmit.co/ajax/" + myEmail, {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    Subject: `New User Alert: ${actionType}`,
                    User_Email: userEmail,
                    Action: actionType,
                    Date_Time: timeNow
                })
            }).catch(err => console.log(err));
        }

        // Login & Sign Up Logic
        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                // Sign Up
                auth.createUserWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        sendEmailNotification(email, "New Account Created (Sign Up)");
                        alert('Account created successfully!');
                        window.location.href = 'index.html';
                    })
                    .catch((error) => {
                        alert('Error: ' + error.message);
                    });
            } else {
                // Login
                auth.signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        sendEmailNotification(email, "User Logged In");
                        alert('Logged in successfully!');
                        window.location.href = 'index.html';
                    })
                    .catch((error) => {
                        alert('Error: ' + error.message);
                    });
            }
        });
    </script>
</body>
</html>
