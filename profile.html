<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Details</title>
    <!-- FontAwesome Icons for Social Buttons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #111827;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Home Button at Top Right */
        .home-nav {
            position: absolute;
            top: 40px;
            right: 80px;
        }

        .home-nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .home-nav a:hover {
            color: #38bdf8;
        }

        /* Profile Card Box */
        .profile-card {
            background-color: #1f2937;
            border-radius: 20px;
            padding: 40px;
            display: flex;
            gap: 40px;
            align-items: center;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #374151;
        }

        /* Left Section: Image and Sinhala Quote */
        .profile-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-right: 30px;
            border-right: 1px solid #374151;
        }

        .profile-img-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
        }

        .quote-text {
            color: #38bdf8;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        /* Right Section: Details & Social Icons */
        .profile-right {
            flex: 1;
        }

        .profile-title {
            color: #38bdf8;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
        }

        .info-group {
            margin-bottom: 30px;
        }

        .info-row {
            display: flex;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .info-label {
            width: 100px;
            font-weight: 600;
            color: #ffffff;
        }

        .info-value {
            color: #e5e7eb;
        }

        /* Social Media Icons Container */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .icon-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            transform: translateY(-3px);
            background-color: #38bdf8;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Top Right Home Button -->
    <nav class="home-nav">
        <a href="index.html">Home</a>
    </nav>

    <!-- Main Profile Card -->
    <div class="profile-card">
        
        <!-- Left Side: Custom Logo and Quote -->
        <div class="profile-left">
            <div class="profile-img-container" style="display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); padding: 3px; border-radius: 50%;">
                <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="border-radius: 50%; background: #0f172a;">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="50%" stop-color="#818cf8" />
                            <stop offset="100%" stop-color="#c084fc" />
                        </linearGradient>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="5" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <rect x="35" y="35" width="130" height="130" rx="30" fill="none" stroke="url(#logoGradient)" stroke-width="6" opacity="0.6"/>
                    <circle cx="80" cy="80" r="35" fill="#38bdf8" opacity="0.3" filter="url(#glow)"/>
                    <circle cx="120" cy="120" r="40" fill="#c084fc" opacity="0.3" filter="url(#glow)"/>
                    <text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" fill="url(#logoGradient)" font-family="'Segoe UI', Tahoma, sans-serif" font-size="85" font-weight="900" style="letter-spacing: -2px;">P</text>
                    <circle cx="135" cy="65" r="8" fill="#38bdf8"/>
                </svg>
            </div>
            <p class="quote-text">ඉතින් කොහොමද ළමයෝ</p>
        </div>

        <!-- Right Side: Details -->
        <div class="profile-right">
            <h2 class="profile-title">Profile Details</h2>

            <div class="info-group">
                <div class="info-row" style="margin-bottom: 18px;">
                    <span class="info-label" style="width: auto; color: #ffffff;">@ PRAMUDITHA shmpr</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Mobile :</span>
                    <span class="info-value">+94 XX XXX XXXX</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Email :</span>
                    <span class="info-value">your-email@gmail.com</span>
                </div>
            </div>

            <!-- Social Media Buttons -->
            <div class="social-icons">
                <a href="#" class="icon-btn"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="icon-btn"><i class="fab fa-instagram"></i></a>
                <a href="#" class="icon-btn"><i class="fab fa-whatsapp"></i></a>
                <a href="#" class="icon-btn"><i class="fab fa-twitter"></i></a>
            </div>
        </div>

    </div>

</body>
</html>
